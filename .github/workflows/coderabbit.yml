name: CodeRabbit Review

# Advisory AI review for every pull request.
# Requires the repository secret CODERABBIT_API_KEY (Agentic API key from
# https://app.coderabbit.ai). Without the secret the job skips quietly, so
# pull requests from forks are never blocked.
#
# If the CodeRabbit GitHub App is installed instead, the app already reviews
# pull requests and this workflow can be deleted.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coderabbit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: CodeRabbit CLI review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check for API key
        id: gate
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
        run: |
          if [ -z "$CODERABBIT_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeRabbit skipped::Set the CODERABBIT_API_KEY repository secret to enable AI reviews."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install CodeRabbit CLI
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl -fsSL https://cli.coderabbit.ai/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Review pull request
        id: review
        if: steps.gate.outputs.enabled == 'true'
        env:
          CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set +e
          coderabbit review --api-key "$CODERABBIT_API_KEY" --base "origin/${BASE_REF}" 2>&1 | tee coderabbit-review.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish job summary
        if: steps.gate.outputs.enabled == 'true'
        run: |
          {
            echo "## CodeRabbit review"
            echo
            echo '````'
            cat coderabbit-review.txt
            echo '````'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EXIT_CODE: ${{ steps.review.outputs.exit_code }}
        run: |
          marker='<!-- coderabbit-cli-review -->'
          {
            echo "$marker"
            echo "### CodeRabbit review"
            echo
            echo '````'
            cat coderabbit-review.txt
            echo '````'
            echo
            echo "<sub>CodeRabbit CLI · exit code ${EXIT_CODE} · advisory only, does not block merging</sub>"
          } > comment.md

          existing=$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file comment.md
          fi
